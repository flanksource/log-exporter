fields:
  - format: table
    label: Logs
    name: logs
    table_options:
      fields:
        - date_format: "2006-01-02 15:04:05"
          format: date
          label: Time
          name: timestamp
          style: text-gray-500 text-sm font-mono
          type: string
        - label: Namespace
          name: namespace
          style: bg-purple-100 text-purple-800 px-2 py-1 rounded font-medium text-sm
          type: string
        - label: Pod
          name: pod
          style: text-blue-600 font-mono text-sm
          type: string
        - label: Container
          name: container
          style: text-indigo-600 font-medium
          type: string
        - label: Message
          name: message
          style: text-gray-700
          type: string
        - color_options:
            blue: DEBUG|TRACE
            gray: UNKNOWN
            green: INFO|INFORMATION|SUCCESS
            red: ERROR|FATAL|CRITICAL
            yellow: WARN|WARNING
          label: Level
          name: level
          style: font-bold uppercase text-xs px-2 py-1 rounded-md
          type: string
        - label: Node
          name: node
          style: text-gray-600 font-mono text-sm
          type: string
        - label: Deployment
          name: deployment
          style: text-emerald-600 font-semibold
          type: string

    type: array
